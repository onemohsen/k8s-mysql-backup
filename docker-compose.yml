services:
  mysql-backup:
    build:
      context: .
      args:
        KUBECTL_VERSION: ${KUBECTL_VERSION:-v1.31.0}
        TARGETARCH: ${TARGETARCH:-amd64}        # arm64 if the server is aarch64
    image: mysql-backup:latest
    container_name: mysql-backup
    restart: unless-stopped
    # ${VAR} values are detected by Coolify and editable in its UI; locally they
    # come from a .env file that `docker compose` reads automatically.
    environment:
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 2 * * *}
      TZ: ${TZ:-UTC}
      TARGETS: ${TARGETS:?set TARGETS, e.g. namespace/pod/user/password}
      EXCLUDE_DBS: ${EXCLUDE_DBS:-}
      EXCLUDE_TABLES: ${EXCLUDE_TABLES:-}
      DUMP_FLAGS: ${DUMP_FLAGS:-}
      EXTRA_DUMP_FLAGS: ${EXTRA_DUMP_FLAGS:-}
      DUMP_RETRIES: ${DUMP_RETRIES:-3}
      DUMP_BACKOFF: ${DUMP_BACKOFF:-15}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-s3}
      RCLONE_PATH: ${RCLONE_PATH:?set RCLONE_PATH, e.g. my-bucket/mysql-backups}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - ./config:/config
      - backups:/backups

volumes:
  backups:
